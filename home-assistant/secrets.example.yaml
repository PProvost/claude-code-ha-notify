---
# Add these two lines to /config/secrets.yaml, with your own values.

# Any long random string. This is the only thing protecting the webhook:
# Home Assistant webhooks have no login, so treat it as a password. Generate
# one with, for example:  python3 -c "import secrets; print(secrets.token_urlsafe(32))"
claude_code_webhook_id: "replace-me-with-a-long-random-string"

# The notify ACTION for your phone - not the notify entity.
#
# The companion app registers two different things per device, and they are
# easy to mix up because both start with "notify.":
#
#   notify.mobile_app_your_phone   the action  <- you want this one
#   notify.your_phone              the entity  <- not this one
#
# Only the action takes a `data:` block, which is where this package puts the
# notification's buttons, its tag (so it can be dismissed from your desk) and
# the iOS interruption level. The entity, used through notify.send_message,
# accepts a message and a title and nothing else.
#
# Find yours under Developer tools -> Actions, searching for
# "notify.mobile_app". Using the entity id here gives you
# "Action notify.<name> not found" in the script trace.
claude_code_notify_service: notify.mobile_app_your_phone
