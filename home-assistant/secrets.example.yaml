---
# Add these two lines to /config/secrets.yaml, with your own values.

# Any long random string. This is the only thing protecting the webhook:
# Home Assistant webhooks have no login, so treat it as a password. Generate
# one with, for example:  python3 -c "import secrets; print(secrets.token_urlsafe(32))"
claude_code_webhook_id: "replace-me-with-a-long-random-string"

# The notify action for your phone, from the companion app. Find yours under
# Developer tools -> Actions, by typing "notify.mobile_app".
claude_code_notify_service: notify.mobile_app_your_phone
